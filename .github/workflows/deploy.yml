name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      # Publish the static site to the gh-pages branch. GitHub serves that
      # branch at https://<owner>.github.io/<repo>/ without any extra setup.
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rfq --cached .
          rm -rf .github tests tools node_modules
          touch .nojekyll
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push --force origin gh-pages
